# === GENERAL RUN PARAMETERS ===
# Email address required for Entrez queries
entrez_login: "thedoudnalab@gmail.com"
# Default thread number for processing in this and associated SMK pipeline
threads: 20
# Run name | the run names must follow the naming standard:
# <mode>_<date>_<medit_version>
# ::mode:: -> At the current version this can be either: 'default' or 'private'
# ::date:: -> MMDDYY
# ::medit_version:: -> current is v0
run_name: "private_103023_v0"
# Must be the same as specified for the run_name
processing_mode: 'private'

# === I/O PATHS ===
# == DIRECTORIES ==
# Canonical storage folder for FASTA References
fasta_root_path: "/groups/clinical/projects/clinical_shared_data/genomes/fasta"
# Parent output directory where files should be stored after processing
output_directory: "/groups/clinical/projects/medit_analysis"
# Directory that holds the query HGVSs
